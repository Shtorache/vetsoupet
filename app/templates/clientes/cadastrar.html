{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Cliente</title>
  <link rel="stylesheet" href="{% static 'css/index.css' %}">
  <link rel="stylesheet" href="{% static 'css/cadastro_cliente.css' %}">
</head>
<body>
    <main class="container">
        <h1 class="page-title">Cadastrar Cliente</h1>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-grid">
                {% for field in form %}
                    <div class="form-group {% if field.name == 'endereco' or field.name == 'foto' %}full-width{% endif %}">
                        <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
                        {{ field }}
                        {% if field.errors %}
                            <small class="text-danger">{{ field.errors }}</small>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>

            <div class="form-actions">
                <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Salvar Cliente</button>
            </div>
        </form>
    </main>
</body>
</html>
