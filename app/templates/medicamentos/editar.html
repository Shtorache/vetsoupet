{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="{% static 'css/editar_medicamento.css' %}">

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Editar Medicamento — {{ medicamento.nome }}</title>
 
</head>
<body>
  <main class="container">
    <header class="page-header">
<div class="header-logo">
 <img src="{% static 'imgs/logo_parceiro_1.png' %}" alt="Logo VET Sou Pet">
</div>
<div class="header-actions">
<a href="{% url 'lista_medicamentos' %}" class="btn btn-voltar">Voltar</a>
</div>
</header>

    <h2>Editar Medicamento: {{ medicamento.nome }}</h2>

    <form method="post" novalidate>
      {% csrf_token %}

      <!-- Render simples -->
      {{ form.as_p }}

     <div class="form-actions">
  <a href="{% url 'lista_medicamentos' %}" class="btn btn-secondary">Cancelar</a>
  <button type="submit" class="btn btn-primary">Salvar Alterações</button>
  <form method="post" action="{% url 'excluir_medicamento' medicamento.pk %}" class="inline-delete" onsubmit="return confirm('Excluir {{ medicamento.nome }}? Esta ação é irreversível.');">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">🗑️ Excluir</button>
  </form>
</div>


    <!-- Botão de excluir rápido (opcional): -->
   
  </main>
</body>
</html>
