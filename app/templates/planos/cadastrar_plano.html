{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Novo Plano de Saúde</title>
  <link rel="stylesheet" href="{% static 'css/cadastro_plano.css' %}">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div class="header-logo">
        <img src="{% static 'imgs/logo_parceiro_1.png' %}" alt="Logo VET Sou Pet">
      </div>
      <div class="header-actions">
        <a href="{% url 'lista_planos' %}" class="btn btn-secondary">Ver Planos</a>
        <a href="{% url 'index' %}" class="btn btn-secondary">Voltar</a>
      </div>
    </header>

    <h2>Cadastrar Plano de Saúde</h2>

    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        <div class="form-group">
          <label for="id_cliente_plano">Cliente:</label>
          {{ form.cliente }}
        </div>

        <div class="form-group">
          <label for="id_animal_plano">Animal:</label>
          {{ form.animal }}
        </div>

        <div class="form-group">
          <label for="id_nome_plano">Nome do Plano:</label>
          {{ form.nome_plano }}
        </div>

        <div class="form-group full-width">
          <label for="id_descricao">Descrição:</label>
          {{ form.descricao }}
        </div>

        <div class="form-group">
          <label for="id_valor_mensal">Valor Mensal (R$):</label>
          {{ form.valor_mensal }}
        </div>

        <div class="form-group">
          <label for="id_validade">Validade:</label>
          {{ form.validade }}
        </div>
      </div>

      <div class="form-actions">
        <a href="{% url 'index' %}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Salvar Plano</button>
      </div>
    </form>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const clienteSelect = document.getElementById("id_cliente_plano");
      const animalSelect = document.getElementById("id_animal_plano");

      clienteSelect.addEventListener("change", async function() {
        const clienteId = this.value;
        animalSelect.innerHTML = "<option value=''>Carregando...</option>";

        if (clienteId) {
          const response = await fetch(`/buscar_pacientes_por_cliente/${clienteId}/`);
          const data = await response.json();

          animalSelect.innerHTML = "<option value=''>---------</option>";
          data.pacientes.forEach(paciente => {
            const option = document.createElement("option");
            option.value = paciente.id;
            option.textContent = paciente.nome;
            animalSelect.appendChild(option);
          });
        } else {
          animalSelect.innerHTML = "<option value=''>Selecione um cliente primeiro</option>";
        }
      });
    });
  </script>
</body>
</html>
