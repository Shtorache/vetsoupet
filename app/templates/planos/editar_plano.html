{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Editar Plano de Saúde</title>
  <link rel="stylesheet" href="{% static 'css/index.css' %}">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div class="header-logo">
        <img src="{% static 'imgs/IMG_6112.PNG' %}" alt="Logo VET Sou Pet">
      </div>
      <div class="header-actions">
        <a href="{% url 'lista_planos' %}" class="btn btn-secondary">Voltar</a>
      </div>
    </header>

    <h2>Editar Plano: {{ plano.nome_plano }}</h2>

    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
          {{ field }}
          {% if field.errors %}
          <small class="text-danger">{{ field.errors }}</small>
          {% endif %}
        </div>
        {% endfor %}
      </div>

      <div class="form-actions">
        <a href="{% url 'lista_planos' %}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
      </div>
    </form>
  </main>

  <script>
    // Script idêntico ao do cadastro (mantém carregamento dinâmico dos animais)
    document.addEventListener("DOMContentLoaded", function() {
      const clienteSelect = document.getElementById("id_cliente_plano");
      const animalSelect = document.getElementById("id_animal_plano");

      clienteSelect.addEventListener("change", async function() {
        const clienteId = this.value;
        animalSelect.innerHTML = "<option value=''>Carregando...</option>";

        if (clienteId) {
          const response = await fetch(`/buscar_pacientes_por_cliente/${clienteId}/`);
          const data = await response.json();

          animalSelect.innerHTML = "<option value=''>---------</option>";
          data.pacientes.forEach(paciente => {
            const option = document.createElement("option");
            option.value = paciente.id;
            option.textContent = paciente.nome;
            animalSelect.appendChild(option);
          });
        } else {
          animalSelect.innerHTML = "<option value=''>Selecione um cliente primeiro</option>";
        }
      });
    });
  </script>
</body>
</html>
