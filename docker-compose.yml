version: '3.9'

services:
  web:
    build: .
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: vetsoupet_db
      DB_USER: vetsoupet_user
      DB_PASSWORD: vetsoupet_pass
      DB_HOST: db
      DB_PORT: 5432

  db:
    image: postgres:14
    environment:
      POSTGRES_DB: vetsoupet_db
      POSTGRES_USER: vetsoupet_user
      POSTGRES_PASSWORD: vetsoupet_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
